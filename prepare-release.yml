name: Prepare release draft
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag matching the ZIP in SHA256SUMS'
        required: true
        default: 'v2.0'
permissions:
  contents: write
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare an unpublished draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo '::error::Use a version tag such as v2.0.'
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > release-state.txt 2>/dev/null; then
            if [[ "$(cat release-state.txt)" != true ]]; then
              echo 'The release is already public. Leaving its notes and assets unchanged.'
              exit 0
            fi
            exists=true
          else
            exists=false
          fi
          read -r checksum filename < SHA256SUMS
          filename="${filename%$'\r'}"
          if [[ ! "$checksum" =~ ^[a-f0-9]{64}$ || "$filename" != "MP4-Converter-${RELEASE_TAG}-Windows-x64.zip" ]]; then
            echo '::error::SHA256SUMS must match the requested version.'
            exit 1
          fi
          if [[ "$exists" == true ]]; then
            gh release edit "$RELEASE_TAG" --draft --title "MP4 Converter $RELEASE_TAG" --notes-file RELEASE-NOTES.md
          else
            gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" --title "MP4 Converter $RELEASE_TAG" --notes-file RELEASE-NOTES.md
          fi
          gh release upload "$RELEASE_TAG" SHA256SUMS --clobber
          echo 'Draft ready. Attach the matching application ZIP and review before publishing.'
