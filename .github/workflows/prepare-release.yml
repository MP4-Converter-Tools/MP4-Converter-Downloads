name: Prepare v1.0 release draft
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prepare-release.yml
      - RELEASE-NOTES.md
      - SHA256SUMS
  workflow_dispatch:
permissions:
  contents: write
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare draft only and attach checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0 --json isDraft --jq .isDraft > release-state.txt 2>/dev/null; then
            if [[ "$(cat release-state.txt)" != true ]]; then
              echo '::error::v1.0 is already published; refusing to alter it.'
              exit 1
            fi
            gh release edit v1.0 --draft --title 'MP4-GIF-Conversion v1.0' --notes-file RELEASE-NOTES.md
          else
            gh release create v1.0 --draft --target "$GITHUB_SHA" --title 'MP4-GIF-Conversion v1.0' --notes-file RELEASE-NOTES.md
          fi
          gh release upload v1.0 SHA256SUMS --clobber
          echo 'Draft prepared. The application ZIP must be attached and reviewed before publishing.'
